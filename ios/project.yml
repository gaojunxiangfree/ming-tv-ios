name: MingTV
options:
  bundleIdPrefix: com.seanming
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MingTVCore:
    path: ..

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # 模拟器免签名(日常开发无感); 真机构建自动走正常签名, 需提供 DEVELOPMENT_TEAM
    CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: NO
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
  configs:
    # 加 UI 测试 target 后 xcodebuild 会为模拟器同时构建 x86_64/arm64,
    # 而本地 SPM 包只产出 arm64, 导致 "built for incompatible target" 模块解析失败.
    # 固定只构建当前架构即可.
    Debug:
      ONLY_ACTIVE_ARCH: YES

targets:
  MingTV:
    type: application
    platform: iOS
    sources:
      - path: MingTV/Sources
    dependencies:
      - package: MingTVCore
        product: MingTVCore
    scheme:
      testTargets:
        - MingTVUITests
    settings:
      base:
        PRODUCT_NAME: MingTV
        PRODUCT_BUNDLE_IDENTIFIER: com.seanming.player
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "10100"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: MingTV/Info.plist
      properties:
        CFBundleDisplayName: 茗影院
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "10100"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 用于在局域网内推送接口配置与远程搜索

  # 开发模式(debug)下的逐屏冒烟验证: 无头环境无法点击, 用 XCUITest 驱动界面
  MingTVUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MingTVUITests
    dependencies:
      - target: MingTV
    settings:
      base:
        PRODUCT_NAME: MingTVUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.seanming.player.uitests
        TEST_TARGET_NAME: MingTV
        # 真机跑 UI 测试需要签名, 而签名要求 target 有 Info.plist
        GENERATE_INFOPLIST_FILE: YES
