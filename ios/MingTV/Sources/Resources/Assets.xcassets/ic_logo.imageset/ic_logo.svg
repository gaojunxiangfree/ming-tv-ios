<?xml version="1.0" encoding="UTF-8"?>
<!-- 由 Android res/drawable/ic_logo.xml 转换而来: 绿色渐变圆角底 + 电视机 + 播放键 -->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#065F46"/>
    </linearGradient>
  </defs>

  <!-- 圆角底 -->
  <rect x="4" y="4" width="100" height="100" rx="18" ry="18" fill="url(#bg)"/>

  <!-- 天线 / 底座立柱 -->
  <g fill="none" stroke="#E9FFF3" stroke-width="4" stroke-linecap="round">
    <path d="M43,36 L33,23"/>
    <path d="M65,36 L75,23"/>
    <path d="M54,76 L54,82"/>
  </g>

  <!-- 底座横杆 -->
  <path d="M42,84 L66,84" fill="none" stroke="#E9FFF3" stroke-width="5" stroke-linecap="round"/>

  <!-- 机身(屏幕) -->
  <rect x="24" y="36" width="60" height="40" rx="6" ry="6"
        fill="#06301C" stroke="#E9FFF3" stroke-width="4.5"/>

  <!-- 播放键 -->
  <path d="M48,47 L68,55 L48,63 Z" fill="#4ADE80"/>
</svg>
