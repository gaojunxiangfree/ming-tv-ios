name: Build iOS IPA

# 在 GitHub 托管的 macOS 构建机上编译 iOS App 并产出 .ipa 安装包。
#
# 签名说明（重要）:
#   本 workflow 产出「未签名」.ipa —— 免费 Apple ID 无法在无头 CI 上自动创建
#   签名证书（证书须先在 Xcode 图形界面生成, -allowProvisioningUpdates 只对
#   付费开发者账号有效）。因此签名放到 Windows 端用「爱思助手」的 Apple ID 自签
#   功能完成: 下载本 workflow 的产物 → 爱思助手导入 → Apple ID 签名安装。
#   免费签名有效期 7 天, 到期用爱思助手重签即可。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Archive & package IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Archive (unsigned, device)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/MingTV.xcodeproj \
            -scheme MingTV \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MingTV.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package .ipa (Payload/App.app)
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MingTV.xcarchive/Products/Applications/MingTV.app"
          test -d "$APP" || { echo "::error::MingTV.app not found in archive"; exit 1; }

          INFO="$APP/Info.plist"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$INFO")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$INFO")"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "MingTV-${VERSION}-${BUILD}-unsigned.ipa" Payload

          echo "IPA_PATH=$RUNNER_TEMP/ipa/MingTV-${VERSION}-${BUILD}-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mingtv-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 7
